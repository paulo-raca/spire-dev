version: 2
updates:
  # Both base images (alpine + ghcr.io/spiffe/spire-*) track upstream
  # `:latest` / are discovered dynamically by CI, so there is nothing for
  # dependabot's docker ecosystem to pin. Only the GitHub Actions
  # workflow pins remain managed here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
