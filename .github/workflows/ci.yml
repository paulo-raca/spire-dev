name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run integration tests
        run: ./tests/test.sh

  publish:
    name: Build & push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read SPIRE version from Dockerfile
        id: ver
        run: |
          set -e
          full=$(grep -oE 'spire-server:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile \
                  | head -1 | cut -d: -f2)
          [ -n "$full" ] || { echo "could not detect SPIRE version" >&2; exit 1; }
          {
            echo "full=$full"
            echo "minor=$(echo "$full" | cut -d. -f1-2)"
            echo "major=$(echo "$full" | cut -d. -f1)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: paulocosta56/spire-dev
          tags: |
            type=raw,value=${{ steps.ver.outputs.full }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.full }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: paulocosta56/spire-dev
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
