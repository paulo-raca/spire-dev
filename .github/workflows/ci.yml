name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Pick up new upstream SPIRE releases without a manual bump.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  discover:
    name: Discover latest SPIRE release
    runs-on: ubuntu-latest
    outputs:
      full:  ${{ steps.ver.outputs.full }}
      minor: ${{ steps.ver.outputs.minor }}
      major: ${{ steps.ver.outputs.major }}
    steps:
      - name: Query GitHub for spiffe/spire's latest release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          full=$(gh api repos/spiffe/spire/releases/latest --jq '.tag_name' | sed 's/^v//')
          [ -n "$full" ] || { echo "could not detect latest SPIRE version" >&2; exit 1; }
          {
            echo "full=$full"
            echo "minor=$(echo "$full" | cut -d. -f1-2)"
            echo "major=$(echo "$full" | cut -d. -f1)"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Build & integration tests
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Run integration tests against latest SPIRE
        env:
          SPIRE_VERSION: ${{ needs.discover.outputs.full }}
        run: ./tests/test.sh

  publish:
    name: Build, push, sign
    needs: [discover, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write       # OIDC for Sigstore signing
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          # Installer's default cosign-release lags upstream. Pin to
          # current cosign so we can rely on modern defaults (OCI 1.1
          # referrers without COSIGN_EXPERIMENTAL). Needs installer v4+
          # to understand cosign v3's Sigstore-bundle release-signing.
          cosign-release: v3.1.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: paulocosta56/spire-dev
          tags: |
            type=raw,value=${{ needs.discover.outputs.full }}
            type=raw,value=${{ needs.discover.outputs.minor }}
            type=raw,value=${{ needs.discover.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.discover.outputs.full }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            SPIRE_VERSION=${{ needs.discover.outputs.full }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit-side SLSA v0.2 provenance describing the build inputs,
          # layer steps, and cache state — complementary to the workflow-side
          # attestation produced by actions/attest-build-provenance below.
          provenance: mode=max
          sbom: true

      - name: Sign image with cosign (keyless OIDC, OCI 1.1 referrer)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS:   ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          # One signature per image-digest covers every tag pointing at this
          # build. The first tag is used only to derive the repo reference.
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          repo="${first_tag%%:*}"
          # cosign v3+ stores signatures as OCI 1.1 referrers by default
          # — no .sig sibling tags, no COSIGN_EXPERIMENTAL needed.
          cosign sign --yes "${repo}@${DIGEST}"

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: paulocosta56/spire-dev
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
