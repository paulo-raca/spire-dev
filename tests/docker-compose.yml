services:
  spire:
    image: paulocosta56/spire-dev:ci
    pull_policy: never
    pid: host
    environment:
      SPIRE_TRUST_DOMAIN: test.local
      SPIRE_WORKLOADS: alpha beta
      SPIRE_JWKS_REFRESH_INTERVAL: "1"
    volumes:
      - spire-sockets:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Test workloads reuse the spire-dev image only for its bundled
  # spire-agent CLI; they aren't running SPIRE themselves, so the image's
  # HEALTHCHECK (which probes the server+agent ports) doesn't apply.
  alpha:
    image: paulocosta56/spire-dev:ci
    pull_policy: never
    entrypoint: ["sleep", "infinity"]
    healthcheck: { test: ["CMD-SHELL", "exit 0"], interval: 2s }
    labels:
      io.spiffe.workload: alpha
    volumes:
      - spire-sockets:/run/spire/sockets:ro
    depends_on:
      spire: { condition: service_healthy }

  beta:
    image: paulocosta56/spire-dev:ci
    pull_policy: never
    entrypoint: ["sleep", "infinity"]
    healthcheck: { test: ["CMD-SHELL", "exit 0"], interval: 2s }
    labels:
      io.spiffe.workload: beta
    volumes:
      - spire-sockets:/run/spire/sockets:ro
    depends_on:
      spire: { condition: service_healthy }

  # An unlabeled workload — must NOT get any SVID.
  intruder:
    image: paulocosta56/spire-dev:ci
    pull_policy: never
    entrypoint: ["sleep", "infinity"]
    healthcheck: { test: ["CMD-SHELL", "exit 0"], interval: 2s }
    volumes:
      - spire-sockets:/run/spire/sockets:ro
    depends_on:
      spire: { condition: service_healthy }

volumes:
  spire-sockets:
